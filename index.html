<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Utopia – remake</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f1;
        --fg: #1d1d1b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #161614;
          --fg: #e9e9e4;
        }
      }
      :root[data-theme="dark"] {
        --bg: #161614;
        --fg: #e9e9e4;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      main {
        padding: 16px;
        text-align: center;
      }
      canvas {
        width: min(100%, 960px);
        height: auto;
        image-rendering: pixelated;
        border: 1px solid currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="screen" width="320" height="256"></canvas>
      <p>Foreløbig skærm. Ingen spildata er indlæst.</p>
    </main>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
